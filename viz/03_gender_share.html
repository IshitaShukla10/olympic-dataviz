<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>128 years toward parity</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2/plotly.min.js"></script>
<style>
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0b0e14; color:#e8ecf1; }

</style>
</head>
<body>
<header>
  <h1>128 years toward parity</h1>
  <p class="sub">Share of Summer Games results that are women's, men's, or mixed/open events, 1896-2020. Dotted line marks 50%.</p>
</header>
<div id="chart"></div>
<script>
const data = {"year": [1896, 1900, 1904, 1908, 1912, 1920, 1924, 1928, 1932, 1936, 1948, 1952, 1956, 1960, 1964, 1968, 1972, 1976, 1980, 1984, 1988, 1992, 1996, 2000, 2004, 2008, 2012, 2016, 2020], "men": [100.0, 87.80977896851977, 98.86956521739133, 97.1993410214168, 93.45528455284551, 87.84029038112523, 91.10378912685336, 84.60820895522389, 85.02626970227671, 86.68264293050325, 85.86470963624761, 74.75140510159966, 77.56836659275683, 78.07570977917982, 78.97225725094577, 76.96833847015971, 66.86822877299068, 68.17438692098092, 70.69072806471686, 68.72378669862192, 68.71455576559546, 62.73626054085491, 61.95025994098637, 58.45437879001552, 57.61570425562401, 56.33152173913043, 53.844111007834286, 54.04066736183525, 48.040215649133025], "women": [0.0, 1.13864701942397, 1.13043478260869, 1.92202086765513, 1.4227642276422698, 3.56926799758015, 3.13014827018121, 6.9496268656716405, 9.19439579684763, 6.09380349195481, 7.2431397574984, 19.97405966277561, 20.54693274205469, 12.807570977917981, 13.96595208070618, 16.33510787335388, 13.126732174351218, 15.476839237057218, 17.17485998755445, 23.34731376073497, 26.559546313799622, 30.37220122128525, 32.921174652241106, 36.90593710337047, 37.45522281129101, 39.57880434782608, 42.5972646394901, 42.16631908237748, 43.98950896109573], "mixed": [0.0, 11.05157401205626, 0.0, 0.87863811092806, 5.12195121951219, 8.59044162129461, 5.7660626029654, 8.44216417910447, 5.77933450087565, 7.22355357754193, 6.89215060625398, 5.27453523562473, 1.88470066518847, 9.116719242902201, 7.06179066834804, 6.696553656486411, 20.0050390526581, 16.34877384196185, 12.13441194772868, 7.9288995406431, 4.72589792060491, 6.89153823785984, 5.12856540677251, 4.63968410661401, 4.92907293308496, 4.08967391304347, 3.5586243526756003, 3.79301355578727, 7.9702753897712295]};

  { x: data.year, y: data.men,   name: 'Men',   type: 'bar', marker: {color:'#4dabf7'} },
];
Plotly.newPlot('chart', traces, {
  barmode: 'stack',
  paper_bgcolor: '#0b0e14', plot_bgcolor: '#0b0e14',
  font: { color: '#e8ecf1', size: 14 },
  xaxis: { title: 'Summer Games (year)', gridcolor: '#222' },
  yaxis: { title: 'Share of results (%)', range: [0,100], gridcolor: '#222' },
  shapes: [{type:'line', x0:1896, x1:2020, y0:50, y1:50, line:{color:'#ffd43b', width:1, dash:'dot'}}],
  legend: { orientation: 'h', y: -0.15 },
  margin: { t: 20 },
}, {responsive: true});

</script>
</body>
</html>
