<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The equity dividend</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2/plotly.min.js"></script>
<style>
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0b0e14; color:#e8ecf1; }
  header { padding:20px 24px 4px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { margin:0; color:#9aa4b2; font-size:0.95rem; max-width:760px; }
  #chart { width:100%; height:640px; }
</style>
</head>
<body>
<header>
  <h1>The equity dividend</h1>
  <p class="sub">PLACEHOLDER DATA -- flfp_ref.csv is not yet sourced from World Bank SL.TLF.CACT.FE.ZS, see docs/DATASETS.md. Female labour-force participation rate vs. each country's share of Paris 2024 medals won by women (countries with >=5 medallists). Bubble size = number of medallists.</p>
</header>
<div id="chart"></div>
<script>
const data = {"x": [49.6, 62.4, 49.9, 54.5, 61.5, 61.1, 58.9, 52.0, 56.9, 58.4, 14.2, 32.8, 60.3, 41.9, 55.7, 72.1, 54.0, 45.2, 20.4, 58.9, 61.1, 49.8, 50.4, 53.8, 63.6, 63.6, 34.6, 49.2, 57.5], "y": [89.47368421052632, 61.78861788617886, 50.0, 80.59701492537313, 71.9298245614035, 66.66666666666666, 47.61904761904761, 32.62032085561497, 51.32743362831859, 50.0, 16.66666666666666, 9.09090909090909, 72.72727272727273, 51.13636363636363, 43.90243902439024, 63.63636363636363, 58.620689655172406, 50.0, 0.0, 58.47457627118644, 78.26086956521739, 39.28571428571428, 13.63636363636363, 36.144578313253014, 43.75, 60.0, 54.54545454545454, 62.5, 56.666666666666664], "text": ["Argentina", "Australia", "Belgium", "Brazil", "Canada", "China", "Denmark", "France", "Germany", "Great Britain", "IR Iran", "India", "Israel", "Italy", "Japan", "Kenya", "Korea", "Mexico", "Morocco", "Netherlands", "Norway", "Poland", "South Africa", "Spain", "Sweden", "Switzerland", "T\u00fcrkiye", "Ukraine", "United States"], "size": [19, 123, 10, 67, 57, 168, 42, 187, 113, 162, 12, 22, 11, 88, 82, 11, 58, 8, 20, 118, 23, 28, 22, 83, 16, 10, 11, 16, 330], "line_x": [14.2, 72.1], "line_y": [10.829396553779237, 72.14854593688315]};

Plotly.newPlot('chart', [
  {
    x: data.x, y: data.y, text: data.text, mode: 'markers+text', type: 'scatter',
    textposition: 'top center', textfont: {size:10, color:'#9aa4b2'},
    marker: { size: data.size, sizeref: Math.max(...data.size)/900, sizemin:6, color:'#4dabf7', line:{width:1,color:'#0b0e14'} },
    hovertemplate: '%{text}<br>FLFP %{x}%%, %{y:.0f}%% of medals won by women<extra></extra>',
    name: 'Country'
  },
  { x: data.line_x, y: data.line_y, mode:'lines', type:'scatter', line:{color:'#495057',dash:'dash'}, name:'Trend', hoverinfo:'skip' }
], {
  paper_bgcolor: '#0b0e14', plot_bgcolor: '#0b0e14',
  font: { color: '#e8ecf1', size: 14 },
  xaxis: { title: 'Female labour-force participation rate (%)', gridcolor: '#222' },
  yaxis: { title: "Share of country's medals won by women (%)", gridcolor: '#222' },
  showlegend: false,
  margin: { t: 20 },
}, {responsive: true});

</script>
</body>
</html>
